<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackFit | Workout Tracker</title>
    <meta name="description" content="Traccia i tuoi allenamenti facilmente ed esporta i dati in JSON, XML e CSV.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>TrackFit</h1>
            <p>Registra le tue performance</p>
        </header>

        <main>
            <section class="glass-panel form-section">
                <h2>Nuovo Allenamento</h2>
                <form id="workout-form">
                    <div class="input-group">
                        <label for="type">Tipo di Allenamento</label>
                        <select id="type" name="type" required>
                            <option value="" disabled selected>Seleziona un'attività...</option>
                            <option value="Sala Pesi">Sala Pesi</option>
                            <option value="Corsa">Corsa</option>
                            <option value="Trekking">Trekking</option>
                            <option value="Ciclismo">Ciclismo</option>
                            <option value="Nuoto">Nuoto</option>
                            <option value="Yoga">Yoga</option>
                            <option value="Altro">Altro</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Durata dell'allenamento</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="number" id="hours" name="hours" min="0" placeholder="Ore (es. 1)" style="flex: 1; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05); color: white; padding: 0.8rem; border-radius: 8px;">
                            <input type="number" id="minutes" name="minutes" min="0" max="59" placeholder="Minuti (es. 45)" style="flex: 1; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05); color: white; padding: 0.8rem; border-radius: 8px;">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        <span>Salva Allenamento</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
                    </button>
                </form>
                <div id="toast" class="toast hidden">Allenamento salvato con successo! 🎉</div>
            </section>

            <section class="glass-panel history-section">
                <h2>Storico Allenamenti</h2>
                <div class="table-container">
                    <table id="workouts-table">
                        <thead>
                            <tr>
                                <th>Data e Ora</th>
                                <th>Tipo</th>
                                <th>Durata</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="workouts-body">
                            <!-- Workouts will be loaded here dynamically -->
                        </tbody>
                    </table>
                </div>
                <div id="empty-state" class="empty-state">
                    Nessun allenamento registrato. Inizia ora!
                </div>
            </section>

            <section class="glass-panel export-section">
                <h2>Esporta Dati</h2>
                <p class="export-desc">Scarica il registro completo dei tuoi allenamenti</p>
                <div class="export-buttons">
                    <button onclick="downloadData('json')" class="btn btn-outline" title="Esporta in JSON">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        JSON
                    </button>
                    <button onclick="downloadData('csv')" class="btn btn-outline" title="Esporta in CSV">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                        CSV
                    </button>
                    <button onclick="downloadData('xml')" class="btn btn-outline" title="Esporta in XML">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><polyline points="10 13 8 15 10 17"></polyline><polyline points="14 13 16 15 14 17"></polyline></svg>
                        XML
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
